<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graphify â€” Code Architecture Visualization</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/vis-network@9.1.6/standalone/umd/vis-network.min.js"
        integrity="sha384-Ux6phic9PEHJ38YtrijhkzyJ8yQlH8i/+buBR8s3mAZOJrP1gwyvAcIYl3GWtpX1"
        crossorigin="anonymous"></script>
<style>
  :root {
    --void: #06060e;
    --void-light: #0c0c18;
    --surface: #111122;
    --surface-hover: #1a1a33;
    --border: rgba(99, 102, 241, 0.15);
    --border-strong: rgba(99, 102, 241, 0.3);
    --indigo: #6366f1;
    --indigo-glow: rgba(99, 102, 241, 0.4);
    --cyan: #06b6d4;
    --cyan-glow: rgba(6, 182, 212, 0.3);
    --amber: #f59e0b;
    --text-primary: #e8e8f0;
    --text-secondary: #8888aa;
    --text-muted: #555577;
    --glass: rgba(17, 17, 34, 0.85);
    --glass-border: rgba(99, 102, 241, 0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--void);
    color: var(--text-primary);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
    height: 100vh;
    overflow: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background:
      radial-gradient(ellipse 80% 50% at 20% 40%, rgba(99, 102, 241, 0.06) 0%, transparent 50%),
      radial-gradient(ellipse 60% 40% at 80% 20%, rgba(6, 182, 212, 0.04) 0%, transparent 50%),
      radial-gradient(ellipse 50% 60% at 50% 80%, rgba(245, 158, 11, 0.03) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
    animation: meshPulse 25s ease-in-out infinite alternate;
  }

  @keyframes meshPulse {
    0% { opacity: 0.7; }
    50% { opacity: 1; }
    100% { opacity: 0.7; }
  }

  body::after {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image:
      linear-gradient(rgba(99, 102, 241, 0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(99, 102, 241, 0.02) 1px, transparent 1px);
    background-size: 80px 80px;
    pointer-events: none;
    z-index: 0;
  }

  #graph {
    flex: 1;
    position: relative;
    z-index: 1;
  }

  #sidebar {
    width: 340px;
    background: var(--glass);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border-left: 1px solid var(--glass-border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
    z-index: 10;
  }

  #sidebar::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 240px;
    background: linear-gradient(180deg, rgba(99, 102, 241, 0.04) 0%, transparent 100%);
    pointer-events: none;
  }

  #header {
    padding: 28px 24px 20px;
    border-bottom: 1px solid var(--border);
    position: relative;
  }

  #header h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.03em;
    background: linear-gradient(135deg, var(--text-primary) 0%, var(--indigo) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 6px;
  }

  #header p {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 400;
    letter-spacing: 0.02em;
  }

  #search-wrap {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    position: relative;
  }

  #search {
    width: 100%;
    background: var(--void);
    border: 1px solid var(--border);
    color: var(--text-primary);
    padding: 11px 14px 11px 40px;
    border-radius: 10px;
    font-size: 13px;
    font-family: 'Inter', sans-serif;
    outline: none;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }

  #search:focus {
    border-color: var(--indigo);
    box-shadow: 0 0 0 4px var(--indigo-glow), 0 4px 16px rgba(0, 0, 0, 0.3);
  }

  #search::placeholder {
    color: var(--text-muted);
  }

  .search-icon {
    position: absolute;
    left: 38px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    pointer-events: none;
    transition: color 0.25s ease;
  }

  #search:focus ~ .search-icon {
    color: var(--indigo);
  }

  #search-results {
    max-height: 220px;
    overflow-y: auto;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    display: none;
    background: var(--surface);
    border-radius: 0 0 10px 10px;
    margin: -1px 0 0 0;
    border: 1px solid var(--border);
    border-top: none;
    animation: slideDown 0.2s ease;
  }

  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  #search-results::-webkit-scrollbar { width: 6px; }
  #search-results::-webkit-scrollbar-track { background: transparent; }
  #search-results::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }

  .search-item {
    animation: fadeInUp 0.15s ease forwards;
    opacity: 0;
    padding: 9px 12px;
    cursor: pointer;
    border-radius: 8px;
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: all 0.15s ease;
    border-left: 3px solid transparent;
    margin-bottom: 2px;
    font-family: 'JetBrains Mono', monospace;
  }

  .search-item:hover {
    background: var(--surface-hover);
    border-left-color: var(--indigo);
    padding-left: 14px;
  }

  #info-panel {
    padding: 24px;
    border-bottom: 1px solid var(--border);
    min-height: 180px;
    position: relative;
  }

  #info-panel h3 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 11px;
    font-weight: 500;
    color: var(--text-muted);
    margin-bottom: 14px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }

  #info-content {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.8;
  }

  #info-content .field {
    margin-bottom: 8px;
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  #info-content .field-label {
    color: var(--text-muted);
    font-size: 10px;
    min-width: 72px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 500;
    font-family: 'Space Grotesk', sans-serif;
  }

  #info-content .field-value {
    color: var(--text-primary);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
  }

  #info-content .empty {
    color: var(--text-muted);
    font-style: italic;
    font-size: 12px;
  }

  .neighbor-link {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 12px;
    margin: 4px 0;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    border-left: 3px solid var(--border);
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    font-family: 'JetBrains Mono', monospace;
  }

  .neighbor-link:hover {
    background: var(--surface-hover);
    border-left-color: var(--indigo);
    padding-left: 14px;
    transform: translateX(2px);
  }

  #neighbors-list {
    max-height: 200px;
    overflow-y: auto;
    margin-top: 10px;
    padding-right: 4px;
  }

  #neighbors-list::-webkit-scrollbar { width: 4px; }
  #neighbors-list::-webkit-scrollbar-track { background: transparent; }
  #neighbors-list::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 2px; }

  #legend-wrap {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
  }

  #legend-wrap::-webkit-scrollbar { width: 6px; }
  #legend-wrap::-webkit-scrollbar-track { background: transparent; }
  #legend-wrap::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }

  #legend-wrap h3 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 11px;
    font-weight: 500;
    color: var(--text-muted);
    margin-bottom: 14px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 12px;
    cursor: pointer;
    border-radius: 8px;
    font-size: 12px;
    transition: all 0.15s ease;
    margin-bottom: 3px;
  }

  .legend-item:hover {
    background: var(--surface-hover);
  }

  .legend-item.dimmed {
    opacity: 0.25;
  }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
    box-shadow: 0 0 10px currentColor;
    transition: box-shadow 0.2s ease;
  }

  .legend-item:hover .legend-dot {
    box-shadow: 0 0 16px currentColor;
  }

  .legend-label {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
  }

  .legend-count {
    color: var(--text-muted);
    font-size: 10px;
    font-family: 'JetBrains Mono', monospace;
    background: var(--void);
    padding: 3px 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
  }

  #stats {
    padding: 18px 24px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(6, 6, 14, 0.6);
  }

  .stat-item {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .stat-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--indigo);
    animation: pulse 2.5s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.4; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.3); }
  }

  #legend-controls {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
    padding: 10px 14px;
    background: var(--void);
    border-radius: 8px;
    border: 1px solid var(--border);
  }

  #legend-controls label {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    font-size: 11px;
    color: var(--text-secondary);
    user-select: none;
    font-family: 'JetBrains Mono', monospace;
    transition: color 0.15s ease;
  }

  #legend-controls label:hover {
    color: var(--text-primary);
  }

  .legend-cb, #select-all-cb {
    appearance: none;
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    border: 1.5px solid var(--border-strong);
    border-radius: 5px;
    background: var(--void);
    cursor: pointer;
    position: relative;
    flex-shrink: 0;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .legend-cb:hover, #select-all-cb:hover {
    border-color: var(--indigo);
  }

  .legend-cb:checked, #select-all-cb:checked {
    background: var(--indigo);
    border-color: var(--indigo);
    box-shadow: 0 0 10px var(--indigo-glow);
  }

  .legend-cb:checked::after, #select-all-cb:checked::after {
    content: '';
    position: absolute;
    left: 5px;
    top: 2px;
    width: 5px;
    height: 9px;
    border: solid #fff;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }

  #select-all-cb:indeterminate {
    background: var(--indigo);
    border-color: var(--indigo);
  }

  #select-all-cb:indeterminate::after {
    content: '';
    position: absolute;
    left: 4px;
    top: 7px;
    width: 8px;
    height: 2px;
    background: #fff;
    border: none;
    transform: none;
  }

  .vis-network:focus { outline: none; }

  .vis-tooltip {
    background: var(--surface) !important;
    border: 1px solid var(--border-strong) !important;
    border-radius: 10px !important;
    padding: 12px 16px !important;
    font-family: 'Inter', sans-serif !important;
    font-size: 12px !important;
    color: var(--text-primary) !important;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5) !important;
    backdrop-filter: blur(12px) !important;
    max-width: 300px !important;
  }

  .loading-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: var(--void);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .loading-overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .loading-spinner {
    width: 48px;
    height: 48px;
    border: 2px solid var(--border);
    border-top-color: var(--indigo);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 20px;
    box-shadow: 0 0 20px var(--indigo-glow);
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-text {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    color: var(--text-secondary);
    letter-spacing: 0.02em;
  }

  .loading-subtext {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 8px;
  }

  @media (max-width: 768px) {
    #sidebar {
      width: 100%;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 50vh;
      border-left: none;
      border-top: 1px solid var(--glass-border);
      border-radius: 16px 16px 0 0;
    }
    #graph {
      height: 50vh;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }

  .vis-live-region {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
</style>
</head>
<body>
<div class="loading-overlay" id="loading">
  <div class="loading-spinner"></div>
  <div class="loading-text">Mapping architecture</div>
  <div class="loading-subtext">Analyzing dependencies and communities</div>
</div>

<div id="graph"></div>

<div id="sidebar" role="complementary" aria-label="Graph controls and information">
  <div id="header">
    <h1>Graphify</h1>
    <p>Code Architecture Visualization</p>
  </div>

  <div id="search-wrap">
    <input id="search" type="text" placeholder="Search nodes..." autocomplete="off" aria-label="Search graph nodes" role="combobox" aria-expanded="false" aria-controls="search-results">
    <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    <div id="search-results"></div>
  </div>

  <div id="info-panel">
    <h3>Node Inspector</h3>
    <div id="info-content"><span class="empty">Click a node to inspect</span></div>
  </div>

  <div id="legend-wrap">
    <h3>Communities</h3>
    <div id="legend-controls">
      <label><input type="checkbox" id="select-all-cb" checked onchange="toggleAllCommunities(!this.checked)">All</label>
    </div>
    <div id="legend"></div>
  </div>

  <div id="stats">
    <div class="stat-item">
      <div class="stat-dot"></div>
      <span id="stats-text">Loading...</span>
    </div>
    <span id="community-count"></span>
  </div>
</div>

;
// Auto-populate LEGEND from RAW_NODES community data
const communityMap = new Map();
RAW_NODES.forEach(n => {
  const cid = n.community || 0;
  const name = n.community_name || `Community ${cid}`;
  if (!communityMap.has(cid)) {
    communityMap.set(cid, { cid, label: name, count: 0 });
  }
  communityMap.get(cid).count++;
});
const LEGEND = Array.from(communityMap.values()).sort((a, b) => b.count - a.count);
</script>

<script>
// esc() for XSS prevention
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// Enhanced color palette for communities
const COMMUNITY_COLORS = [
  '#6366f1', '#06b6d4', '#f59e0b', '#ec4899', '#10b981',
  '#8b5cf6', '#f97316', '#14b8a6', '#e11d48', '#84cc16',
  '#3b82f6', '#a855f7', '#ef4444', '#22d3ee', '#fbbf24'
];

function getCommunityColor(index) {
  return COMMUNITY_COLORS[index % COMMUNITY_COLORS.length];
}

// Build vis datasets with enhanced styling
const nodesDS = new vis.DataSet(RAW_NODES.map(n => {
  const color = getCommunityColor(n.community || 0);
  return {
    id: n.id,
    label: n.label,
    color: {
      background: color,
      border: color,
      highlight: {
        background: '#ffffff',
        border: color
      },
      hover: {
        background: color,
        border: '#ffffff'
      }
    },
    size: Math.max(8, Math.min(50, n.size || 10)),
    font: {
      size: (n.size > 20) ? 12 : 0,
      color: '#ffffff',
      face: 'Space Grotesk'
    },
    title: n.title || n.label,
    _community: n.community,
    _community_name: n.community_name,
    _source_file: n.source_file,
    _file_type: n.file_type,
    _degree: n.degree
  };
}));

const edgesDS = new vis.DataSet(RAW_EDGES.map((e, i) => ({
  id: i,
  from: e.from,
  to: e.to,
  label: '',
  title: e.title,
  dashes: e.dashes,
  width: e.width || 1.5,
  color: {
    color: 'rgba(99, 102, 241, 0.3)',
    highlight: '#6366f1',
    hover: '#6366f1',
    opacity: 0.6
  },
  arrows: {
    to: {
      enabled: true,
      scaleFactor: 0.5,
      type: 'arrow'
    }
  },
  smooth: {
    type: 'continuous',
    roundness: 0.3
  }
})));

// Update stats
document.getElementById('stats-text').textContent = `${RAW_NODES.length} nodes \u00b7 ${RAW_EDGES.length} edges`;
const uniqueCommunities = new Set(RAW_NODES.map(n => n.community)).size;
document.getElementById('community-count').textContent = `${uniqueCommunities} communities`;

const container = document.getElementById('graph');
let network;
try {
  network = new vis.Network(container, { nodes: nodesDS, edges: edgesDS }, {
  physics: {
    enabled: true,
    solver: 'forceAtlas2Based',
    forceAtlas2Based: {
      gravitationalConstant: -50,
      centralGravity: 0.004,
      springLength: 140,
      springConstant: 0.06,
      damping: 0.45,
      avoidOverlap: 0.7
    },
    stabilization: {
      iterations: 250,
      fit: true,
      updateInterval: 25
    }
  },
  interaction: {
    hover: true,
    tooltipDelay: 80,
    hideEdgesOnDrag: true,
    navigationButtons: false,
    keyboard: false,
    zoomView: true,
    dragView: true,
    multiselect: false
  },
  nodes: {
    shape: 'dot',
    borderWidth: 2,
    shadow: {
      enabled: true,
      color: 'rgba(0, 0, 0, 0.3)',
      size: 10,
      x: 0,
      y: 2
    }
  },
  edges: {
    smooth: {
      type: 'continuous',
      roundness: 0.3
    },
    selectionWidth: 3,
    hoverWidth: 2
  }
});
} catch (e) {
  console.error('Failed to initialize graph:', e);
  document.getElementById('loading').innerHTML = `
    <div class="loading-text" style="color: #ef4444;">Failed to load graph</div>
    <div class="loading-subtext">${e.message}</div>
  `;
}

// Hide loading overlay after stabilization
if (network) {
  network.once('stabilizationIterationsDone', () => {
    network.setOptions({ physics: { enabled: false } });
    document.getElementById('loading').classList.add('hidden');
  });
}

// Also hide after timeout as fallback
setTimeout(() => {
  document.getElementById('loading').classList.add('hidden');
}, 5000);

function showInfo(nodeId) {
  const n = nodesDS.get(nodeId);
  if (!n) return;
  const neighborIds = network.getConnectedNodes(nodeId);
  const neighborItems = neighborIds.map(nid => {
    const nb = nodesDS.get(nid);
    const color = nb ? nb.color.background : '#555';
    return `<span class="neighbor-link" style="border-left-color:${esc(color)}" data-nid="${esc(nid)}">${esc(nb ? nb.label : nid)}</span>`;
  }).join('');

  const communityColor = getCommunityColor(n._community || 0);

  document.getElementById('info-content').innerHTML = `
    <div class="field">
      <span class="field-label">Name</span>
      <span class="field-value"><b>${esc(n.label)}</b></span>
    </div>
    <div class="field">
      <span class="field-label">Type</span>
      <span class="field-value">${esc(n._file_type || 'unknown')}</span>
    </div>
    <div class="field">
      <span class="field-label">Community</span>
      <span class="field-value" style="color:${communityColor}">${esc(n._community_name)}</span>
    </div>
    <div class="field">
      <span class="field-label">Source</span>
      <span class="field-value">${esc(n._source_file || '-')}</span>
    </div>
    <div class="field">
      <span class="field-label">Degree</span>
      <span class="field-value">${n._degree}</span>
    </div>
    ${neighborIds.length ? `
      <div class="field" style="margin-top:12px">
        <span class="field-label">Neighbors</span>
        <span class="field-value">${neighborIds.length}</span>
      </div>
      <div id="neighbors-list">${neighborItems}</div>
    ` : ''}
  `;
}

function focusNode(nodeId) {
  if (!network) return;
  network.focus(nodeId, { scale: 1.5, animation: { duration: 400, easingFunction: 'easeOutQuad' } });
  network.selectNodes([nodeId]);
  showInfo(nodeId);
}

// Delegated click handler for neighbor links
document.addEventListener('click', e => {
  const el = e.target.closest('.neighbor-link');
  if (el && el.dataset.nid !== undefined) focusNode(el.dataset.nid);
});

// Hover and click tracking
let hoveredNodeId = null;

if (network) {
  network.on('hoverNode', params => {
    hoveredNodeId = params.node;
    container.style.cursor = 'pointer';
  });

  network.on('blurNode', () => {
    hoveredNodeId = null;
    container.style.cursor = 'default';
  });
}

container.addEventListener('click', () => {
  if (hoveredNodeId !== null && network) {
    showInfo(hoveredNodeId);
    network.selectNodes([hoveredNodeId]);
  }
});

if (network) {
  network.on('click', params => {
    if (params.nodes.length > 0) {
      showInfo(params.nodes[0]);
  } else if (hoveredNodeId === null) {
    document.getElementById('info-content').innerHTML = '<span class="empty">Click a node to inspect</span>';
    }
  });
}

// Search functionality
const searchInput = document.getElementById('search');
const searchResults = document.getElementById('search-results');

searchInput.addEventListener('input', () => {
  const q = searchInput.value.toLowerCase().trim();
  searchResults.innerHTML = '';
  if (!q) { 
    searchResults.style.display = 'none'; 
    searchInput.setAttribute('aria-expanded', 'false');
    return; 
  }

  const matches = RAW_NODES.filter(n => n.label.toLowerCase().includes(q)).slice(0, 25);
  if (!matches.length) { 
    searchResults.style.display = 'none'; 
    searchInput.setAttribute('aria-expanded', 'false');
    return; 
  }

  searchResults.style.display = 'block';
  searchInput.setAttribute('aria-expanded', 'true');
  matches.forEach((n, idx) => {
    const el = document.createElement('div');
    el.className = 'search-item';
    el.textContent = n.label;
    el.setAttribute('role', 'option');
    const color = getCommunityColor(n.community || 0);
    el.style.borderLeftColor = color;
    el.style.animationDelay = `${idx * 30}ms`;
    el.onclick = () => {
      if (network) {
        network.focus(n.id, { scale: 1.6, animation: { duration: 400, easingFunction: 'easeOutQuad' } });
        network.selectNodes([n.id]);
      }
      showInfo(n.id);
      searchResults.style.display = 'none';
      searchInput.setAttribute('aria-expanded', 'false');
      searchInput.value = '';
    };
    searchResults.appendChild(el);
  });
});

document.addEventListener('click', e => {
  if (!searchResults.contains(e.target) && e.target !== searchInput) {
    searchResults.style.display = 'none';
    searchInput.setAttribute('aria-expanded', 'false');
  }
});

// Community filtering
const hiddenCommunities = new Set();
const selectAllCb = document.getElementById('select-all-cb');

function updateSelectAllState() {
  const total = LEGEND.length;
  const hidden = hiddenCommunities.size;
  selectAllCb.checked = hidden === 0;
  selectAllCb.indeterminate = hidden > 0 && hidden < total;
}

function toggleAllCommunities(hide) {
  document.querySelectorAll('.legend-item').forEach(item => {
    hide ? item.classList.add('dimmed') : item.classList.remove('dimmed');
  });
  document.querySelectorAll('.legend-cb').forEach(cb => {
    cb.checked = !hide;
  });
  LEGEND.forEach(c => {
    if (hide) hiddenCommunities.add(c.cid); else hiddenCommunities.delete(c.cid);
  });
  const updates = RAW_NODES.map(n => ({ id: n.id, hidden: hide }));
  nodesDS.update(updates);
  updateSelectAllState();
}

// Build legend
const legendEl = document.getElementById('legend');
LEGEND.forEach((c, idx) => {
  const item = document.createElement('div');
  item.className = 'legend-item';
  const cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.className = 'legend-cb';
  cb.checked = true;
  cb.addEventListener('change', (e) => {
    e.stopPropagation();
    if (cb.checked) {
      hiddenCommunities.delete(c.cid);
      item.classList.remove('dimmed');
    } else {
      hiddenCommunities.add(c.cid);
      item.classList.add('dimmed');
    }
    const updates = RAW_NODES
      .filter(n => n.community === c.cid)
      .map(n => ({ id: n.id, hidden: !cb.checked }));
    nodesDS.update(updates);
    updateSelectAllState();
  });

  const color = getCommunityColor(c.cid);
  item.innerHTML = `<div class="legend-dot" style="background:${color};color:${color}"></div>
    <span class="legend-label">${esc(c.label)}</span>
    <span class="legend-count">${c.count}</span>`;
  item.prepend(cb);
  item.onclick = (e) => {
    if (e.target === cb) return;
    cb.checked = !cb.checked;
    cb.dispatchEvent(new Event('change'));
  };
  legendEl.appendChild(item);
});

// Hyperedge rendering
const hyperedges = [];

function convexHull(pts) {
  const p = pts.slice().sort((a, b) => (a.x - b.x) || (a.y - b.y));
  if (p.length < 3) return p;
  const cross = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
  const build = seq => {
    const out = [];
    for (const q of seq) {
      while (out.length >= 2 && cross(out[out.length - 2], out[out.length - 1], q) <= 0) out.pop();
      out.push(q);
    }
    out.pop();
    return out;
  };
  const hull = build(p).concat(build(p.slice().reverse()));
  return hull.length >= 3 ? hull : p;
}

if (network) {
  network.on('afterDrawing', function(ctx) {
  hyperedges.forEach(h => {
    const positions = h.nodes
      .map(nid => network.getPositions([nid])[nid])
      .filter(p => p !== undefined);
    if (positions.length < 2) return;

    ctx.save();
    ctx.globalAlpha = 0.1;
    ctx.fillStyle = '#6366f1';
    ctx.strokeStyle = '#6366f1';
    ctx.lineWidth = 2;

    const cx = positions.reduce((s, p) => s + p.x, 0) / positions.length;
    const cy = positions.reduce((s, p) => s + p.y, 0) / positions.length;
    const hull = convexHull(positions);
    const expanded = hull.map(p => ({
      x: cx + (p.x - cx) * 1.18,
      y: cy + (p.y - cy) * 1.18
    }));

    ctx.moveTo(expanded[0].x, expanded[0].y);
    expanded.slice(1).forEach(p => ctx.lineTo(p.x, p.y));
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 0.35;
    ctx.stroke();

    ctx.globalAlpha = 0.7;
    ctx.fillStyle = '#4f46e5';
    ctx.font = 'bold 11px Space Grotesk';
    ctx.textAlign = 'center';
    ctx.fillText(h.label, cx, cy - 6);
    ctx.restore();
  });
});
}
</script>
